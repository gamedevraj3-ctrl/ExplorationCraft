name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_PATH: ExportedProject
  UNITY_VERSION: 2022.3.62f1

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unpack Unity project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ExplorationCraft_FlightMode_Updated.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            exit 1
          fi

          rm -rf "$PROJECT_PATH"
          unzip -q "$ZIP" -d .

          if [ ! -f "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt" ]; then
            echo "ERROR: Unity project was not found at $PROJECT_PATH."
            exit 1
          fi

          grep -q "$UNITY_VERSION" "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          echo "Unity project verified: $UNITY_VERSION"

      - name: Check Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "${UNITY_LICENSE:-}" ] && {
            [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ];
          }; then
            echo "ERROR: Add either UNITY_LICENSE or both UNITY_EMAIL and UNITY_PASSWORD repository secrets."
            exit 1
          fi

          echo "Unity authentication secret(s) detected."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-Android-

      - name: Create CI build script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_PATH/Assets/Editor"

          cat > "$PROJECT_PATH/Assets/Editor/CIBuild.cs" << 'EOF'
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class CIBuild
          {
              public static void BuildAndroid()
              {
                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.Android,
                      ScriptingImplementation.IL2CPP);

                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;
                  EditorUserBuildSettings.androidBuildSystem = AndroidBuildSystem.Gradle;
                  EditorUserBuildSettings.buildAppBundle = false;

                  var scenes = EditorBuildSettings.scenes
                      .Where(scene => scene.enabled)
                      .Select(scene => scene.path)
                      .ToArray();

                  if (scenes.Length == 0)
                  {
                      Debug.LogError("No enabled scenes found in EditorBuildSettings.");
                      EditorApplication.Exit(2);
                      return;
                  }

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = "build/Android/ExplorationCraft.apk",
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };

                  var report = BuildPipeline.BuildPlayer(options);

                  Debug.Log(
                      $"Build result: {report.summary.result}; " +
                      $"errors={report.summary.totalErrors}; " +
                      $"warnings={report.summary.totalWarnings}");

                  if (report.summary.result != BuildResult.Succeeded)
                      EditorApplication.Exit(1);
              }
          }
          EOF

          sed -i 's/^          //' "$PROJECT_PATH/Assets/Editor/CIBuild.cs"

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: CIBuild.BuildAndroid
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel34
          allowDirtyBuild: true
          customParameters: -nographics

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExplorationCraft-arm64-v8a-apk
          path: build/Android/*.apk
          if-no-files-found: error
