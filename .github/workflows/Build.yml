name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_PATH: ExportedProject
  UNITY_VERSION: 2022.3.62f1

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unpack Unity project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "ExplorationCraft_FlightMode_Updated.zip" ]; then
            echo "Project ZIP not found at repository root."
            exit 1
          fi
          rm -rf "$PROJECT_PATH"
          unzip -q "ExplorationCraft_FlightMode_Updated.zip" -d .
          test -f "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          grep -q "$UNITY_VERSION" "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"

      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "${UNITY_LICENSE:-}" ]; then
            echo 'UNITY_LICENSE is missing.'
            echo 'Run the Acquire activation file workflow, download the .alf artifact, submit it at https://license.unity3d.com/manual, download the resulting .ulf, and save the complete .ulf contents as the repository secret UNITY_LICENSE.'
            exit 1
          fi

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-Android-

      - name: Create CI build script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH/Assets/Editor"
          cat > "$PROJECT_PATH/Assets/Editor/CIBuild.cs" << 'EOF'
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class CIBuild
          {
              public static void BuildAndroid()
              {
                  PlayerSettings.SetScriptingBackend(BuildTargetGroup.Android, ScriptingImplementation.IL2CPP);
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;
                  EditorUserBuildSettings.androidBuildSystem = AndroidBuildSystem.Gradle;
                  EditorUserBuildSettings.buildAppBundle = false;

                  var scenes = EditorBuildSettings.scenes.Where(s => s.enabled).Select(s => s.path).ToArray();
                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = "build/Android/ExplorationCraft.apk",
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };

                  var report = BuildPipeline.BuildPlayer(options);
                  if (report.summary.result != BuildResult.Succeeded)
                      EditorApplication.Exit(1);
              }
          }
          EOF
          sed -i 's/^          //' "$PROJECT_PATH/Assets/Editor/CIBuild.cs"

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: CIBuild.BuildAndroid
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel34
          allowDirtyBuild: true
          customParameters: -nographics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExplorationCraft-arm64-v8a-apk
          path: build/Android/*.apk
          if-no-files-found: error
