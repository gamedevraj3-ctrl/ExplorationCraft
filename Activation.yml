name: Acquire activation request (.alf)

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity manual activation request
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Upload .alf request artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-2022.3.62f1-activation-request
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
